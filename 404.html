<!DOCTYPE html>
<html lang="de">
<!-- © Max!!! Schrauben Alle Links v1.3.0 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="404-title">404 - Seite nicht gefunden</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Audiowide&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">

    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body class="error-page">

    <canvas id="particle-canvas"></canvas>

    <div id="hero-glow">
        <div id="hero-glow-inner"></div>
    </div>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title" data-i18n="seite-nicht-gefunden">Seite nicht gefunden!</h1>
        <p class="error-message" data-i18n="fehler-nachricht">
            Ups! Die Seite, die du suchst, existiert nicht (mehr).<br>
        </p>
        <div class="button-group">
            <a href="/" class="btn">
                <img src="/home-icon.png" class="link-icon" alt="Home Icon">
                <span data-i18n="zur-startseite">ZUR STARTSEITE</span>
            </a>
            <a href="javascript:history.back()" class="btn">
                <img src="/back-icon.png" class="link-icon" alt="Back Icon">
                <span data-i18n="zurueck">ZURÜCK</span>
            </a>
        </div>
    </div>

    <script src="/lang.js"></script>
    <script type="module" src="/particles.js"></script>
    <script>
        (function () {
            const glowInner = document.getElementById('hero-glow-inner');

            const BASE_SIZE = 320;
            const EDGE_SIZE = 600;
            const EDGE_ZONE = 0.22;

            let mouseX = -9999, mouseY = -9999;
            let currentX = -9999, currentY = -9999;
            let currentSize = BASE_SIZE;
            let targetSize = BASE_SIZE;
            let visible = false;
            let animating = false;

            function edgeFactor(x, y) {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const nx = x / w;
                const ny = y / h;
                const minDist = Math.min(nx, 1 - nx, ny, 1 - ny);
                return minDist < EDGE_ZONE ? 1 - (minDist / EDGE_ZONE) : 0;
            }

            function glowLoop() {
                if (!visible) { animating = false; return; }
                animating = true;

                currentX += (mouseX - currentX) * 0.06;
                currentY += (mouseY - currentY) * 0.06;

                const edge = edgeFactor(mouseX, mouseY);
                targetSize = BASE_SIZE + (EDGE_SIZE - BASE_SIZE) * edge * edge;
                currentSize += (targetSize - currentSize) * 0.05;

                glowInner.style.left = currentX + 'px';
                glowInner.style.top = currentY + 'px';
                glowInner.style.width = currentSize + 'px';
                glowInner.style.height = currentSize + 'px';

                requestAnimationFrame(glowLoop);
            }

            document.addEventListener('mousemove', function (e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
                if (!visible) {
                    visible = true;
                    glowInner.style.opacity = '1';
                    currentX = mouseX;
                    currentY = mouseY;
                    if (!animating) glowLoop();
                }
            });

            document.addEventListener('mouseleave', function () {
                visible = false;
                glowInner.style.opacity = '0';
            });

            const buttons = document.querySelectorAll('.btn');

            buttons.forEach(function (btn) {
                btn.addEventListener('mousemove', function (e) {
                    const rect = btn.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    btn.style.setProperty('--mouse-x', x + '%');
                    btn.style.setProperty('--mouse-y', y + '%');
                });
            });
        })();
    </script>
</body>

</html>
